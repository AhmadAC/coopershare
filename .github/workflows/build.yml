#################### START OF FILE: .github/workflows/build.yml ####################

name: Build MrCoopersScreenShare Executables

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. Build Windows Onedir Packages (sender & receiver)
  # =========================================================================
  build-windows:
    name: Build Windows Onedir Packages
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install PySide6 opencv-python-headless mss sounddevice numpy pynput pyinstaller

      - name: Build sender (onedir) with PyInstaller
        run: |
          pyinstaller --noconsole --onedir `
            --name "sender" `
            --hidden-import "sounddevice" `
            --hidden-import "pynput" `
            --hidden-import "pynput.keyboard._win32" `
            --hidden-import "pynput.mouse._win32" `
            --hidden-import "mss" `
            --hidden-import "cv2" `
            sender.py

      - name: Build receiver (onedir) with PyInstaller
        run: |
          pyinstaller --noconsole --onedir `
            --name "receiver" `
            --hidden-import "sounddevice" `
            --hidden-import "mss" `
            --hidden-import "cv2" `
            receiver.py

      - name: Bundle raw scripts & create portable ZIP archives
        run: |
          # Copy source scripts into output folders so users can directly edit/replace them
          Copy-Item "sender.py" -Destination "dist\sender\sender.py"
          Copy-Item "receiver.py" -Destination "dist\receiver\receiver.py"

          # Compress to zip files for distribution
          Compress-Archive -Path "dist\sender" -DestinationPath "dist\MrCoopersScreenShare-Sender-Windows.zip"
          Compress-Archive -Path "dist\receiver" -DestinationPath "dist\MrCoopersScreenShare-Receiver-Windows.zip"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-onedir-packages
          path: |
            dist/MrCoopersScreenShare-Sender-Windows.zip
            dist/MrCoopersScreenShare-Receiver-Windows.zip
          retention-days: 14

  # =========================================================================
  # 2. Build Linux Standalone Packages (Sender Script)
  # =========================================================================
  build-linux:
    name: Build Linux Onedir & AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libportaudio2 libpulse-dev wget file zip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install PySide6 opencv-python-headless mss sounddevice numpy evdev pyinstaller

      - name: Build onedir package with PyInstaller
        run: |
          pyinstaller --noconsole --onedir \
            --name "sender" \
            --hidden-import "sounddevice" \
            --hidden-import "evdev" \
            --hidden-import "mss" \
            --hidden-import "cv2" \
            sender.py

          # Copy editable script into directory
          cp sender.py dist/sender/sender.py
          cd dist && zip -r MrCoopersScreenShare-Sender-Linux.zip sender/ && cd ..

      - name: Package as AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/sender/* AppDir/usr/bin/

          cat << 'EOF' > AppDir/mrcoopers-sender.desktop
          [Desktop Entry]
          Type=Application
          Name=MrCoopersScreenShare Sender
          Comment=Screen sharing and touch controller
          Exec=sender
          Icon=mrcoopers-sender
          Categories=Utility;Network;
          Terminal=false
          EOF

          cat << 'EOF' > AppDir/mrcoopers-sender.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <rect width="64" height="64" rx="14" fill="#0078d4"/>
            <polygon points="24,18 46,32 24,46" fill="#ffffff"/>
          </svg>
          EOF
          cp AppDir/mrcoopers-sender.svg AppDir/.DirIcon
          cp AppDir/mrcoopers-sender.svg AppDir/usr/share/icons/hicolor/256x256/apps/mrcoopers-sender.svg

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/sender" "$@"
          EOF
          chmod +x AppDir/AppRun

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir MrCoopersScreenShare-Sender-x86_64.AppImage

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/MrCoopersScreenShare-Sender-Linux.zip
            MrCoopersScreenShare-Sender-x86_64.AppImage
          retention-days: 14

  # =========================================================================
  # 3. Create GitHub Release (Runs on git tags like v1.0.0)
  # =========================================================================
  create-release:
    name: Publish Release Assets
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-onedir-packages
          path: release-assets

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: release-assets

      - name: Create Release and Upload Files
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/MrCoopersScreenShare-Sender-Windows.zip
            release-assets/MrCoopersScreenShare-Receiver-Windows.zip
            release-assets/MrCoopersScreenShare-Sender-Linux.zip
            release-assets/MrCoopersScreenShare-Sender-x86_64.AppImage
          draft: false
          prerelease: false
          compression-level: 6