name: Build MrCoopersScreenShare Executables

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. Build Windows Onedir Packages (sender & receiver)
  # =========================================================================
  build-windows:
    name: Build Windows Onedir Packages
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14.6
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install PySide6 opencv-python-headless mss sounddevice numpy pynput pyinstaller

      - name: Build sender (onedir) with PyInstaller
        run: |
          pyinstaller --noconsole --onedir `
            --name "sender" `
            --icon "icon.ico" `
            --add-data "icon.ico;." `
            --add-data "icon.png;." `
            --hidden-import "sounddevice" `
            --hidden-import "pynput" `
            --hidden-import "pynput.keyboard._win32" `
            --hidden-import "pynput.mouse._win32" `
            --hidden-import "mss" `
            --hidden-import "cv2" `
            --hidden-import "PySide6.QtSvg" `
            sender.py

      - name: Build receiver (onedir) with PyInstaller
        run: |
          pyinstaller --noconsole --onedir `
            --name "receiver" `
            --icon "icon.ico" `
            --add-data "icon.ico;." `
            --add-data "icon.png;." `
            --hidden-import "sounddevice" `
            --hidden-import "pynput" `
            --hidden-import "pynput.keyboard._win32" `
            --hidden-import "pynput.mouse._win32" `
            --hidden-import "mss" `
            --hidden-import "cv2" `
            --hidden-import "PySide6.QtSvg" `
            receiver.py

      - name: Bundle raw scripts, assets & create portable ZIP archives
        run: |
          Copy-Item "sender.py" -Destination "dist\sender\sender.py"
          Copy-Item "receiver.py" -Destination "dist\receiver\receiver.py"
          Copy-Item "icon.ico" -Destination "dist\sender\icon.ico"
          Copy-Item "icon.png" -Destination "dist\sender\icon.png"
          Copy-Item "icon.ico" -Destination "dist\receiver\icon.ico"
          Copy-Item "icon.png" -Destination "dist\receiver\icon.png"
          Get-ChildItem -Path . -Filter "*.py" | ForEach-Object {
            Copy-Item $_.FullName -Destination "dist\sender\" -Force
          }
          Compress-Archive -Path "dist\sender" -DestinationPath "dist\MrCoopersScreenShare-Sender-Windows.zip"
          Compress-Archive -Path "dist\receiver" -DestinationPath "dist\MrCoopersScreenShare-Receiver-Windows.zip"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-onedir-packages
          path: |
            dist/MrCoopersScreenShare-Sender-Windows.zip
            dist/MrCoopersScreenShare-Receiver-Windows.zip
          retention-days: 14

  # =========================================================================
  # 2. Build Linux Standalone Packages & Fedora Kinoite-Ready AppImage
  # =========================================================================
  build-linux:
    name: Build Linux Onedir & AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libportaudio2 libpulse-dev wget file zip libfuse2

      - name: Set up Python 3.14.6
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install PySide6 opencv-python-headless mss sounddevice numpy evdev pyinstaller

      - name: Build onedir package with PyInstaller
        run: |
          pyinstaller --noconsole --onedir \
            --name "sender" \
            --icon "icon.png" \
            --add-data "icon.png:." \
            --add-data "icon.ico:." \
            --hidden-import "sounddevice" \
            --hidden-import "evdev" \
            --hidden-import "mss" \
            --hidden-import "cv2" \
            --hidden-import "PySide6.QtDBus" \
            --hidden-import "PySide6.QtSvg" \
            sender.py

          # Copy editable scripts into directory for onedir portable archive
          cp *.py dist/sender/ 2>/dev/null || cp sender.py dist/sender/
          cp icon.png dist/sender/ 2>/dev/null || true
          cp icon.ico dist/sender/ 2>/dev/null || true
          cd dist && zip -r MrCoopersScreenShare-Sender-Linux.zip sender/ && cd ..

      - name: Package Standalone AppImage for Fedora 44 Kinoite (FUSE3 Native)
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          # 1. Structure AppDir tree
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Copy PyInstaller bundled onedir payload
          cp -r dist/sender/* AppDir/usr/bin/

          # 2. Place crisp SVG and PNG application icons
          if [ -f "icon.png" ]; then
            cp icon.png AppDir/usr/share/icons/hicolor/256x256/apps/mrcoopers-screenshare-sender.png
            cp icon.png AppDir/.DirIcon
          fi

          cat << 'EOF' > AppDir/mrcoopers-screenshare-sender.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <rect width="64" height="64" rx="14" fill="#0078d4"/>
            <rect x="14" y="15" width="36" height="24" rx="4" fill="#ffffff"/>
            <rect x="18" y="19" width="28" height="16" fill="#1a1e29"/>
            <rect x="29" y="41" width="6" height="4" fill="#ffffff"/>
            <rect x="22" y="45" width="20" height="3" rx="1.5" fill="#ffffff"/>
          </svg>
          EOF
          cp AppDir/mrcoopers-screenshare-sender.svg AppDir/usr/share/icons/hicolor/256x256/apps/mrcoopers-screenshare-sender.svg
          if [ ! -f "icon.png" ]; then
            cp AppDir/mrcoopers-screenshare-sender.svg AppDir/.DirIcon
          fi

          # 3. Create desktop file with mandatory KDE Plasma 6 Wayland permission interfaces
          cat << 'EOF' > AppDir/mrcoopers-screenshare-sender.desktop
          [Desktop Entry]
          Type=Application
          Name=MrCoopersScreenShare Sender
          Comment=Screen sharing and touch controller
          Exec=sender
          Icon=mrcoopers-screenshare-sender
          Categories=Utility;Network;
          Terminal=false
          StartupNotify=false
          X-KDE-DBUS-Restricted-Interfaces=org.kde.kwin.Screenshot,org.kde.KWin.ScreenShot2
          X-KDE-Wayland-Interfaces=org_kde_plasma_window_management,zkde_screencast_unstable_v1
          EOF

          # Ensure AppDir root has desktop file symlinked for AppImageKit metadata linter
          cp AppDir/mrcoopers-screenshare-sender.desktop AppDir/usr/share/applications/mrcoopers-screenshare-sender.desktop

          # 4. AppRun bootstrap: set up Wayland, Qt platform paths, and shared libs
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/bin:${HERE}/usr/lib:${LD_LIBRARY_PATH}"

          # Automatically resolve PySide6 Wayland and platform plugins
          if [ -d "${HERE}/usr/bin/PySide6/Qt/plugins" ]; then
              export QT_PLUGIN_PATH="${HERE}/usr/bin/PySide6/Qt/plugins:${QT_PLUGIN_PATH}"
          elif [ -d "${HERE}/usr/bin/_internal/PySide6/Qt/plugins" ]; then
              export QT_PLUGIN_PATH="${HERE}/usr/bin/_internal/PySide6/Qt/plugins:${QT_PLUGIN_PATH}"
          fi

          # Sensible defaults for modern Wayland environments
          if [ -z "${QT_QPA_PLATFORM}" ] && [ -n "${WAYLAND_DISPLAY}" ]; then
              export QT_QPA_PLATFORM="wayland;xcb"
          fi

          exec "${HERE}/usr/bin/sender" "$@"
          EOF
          chmod +x AppDir/AppRun

          # 5. Fetch appimagetool and the modern type-2 runtime (eliminates libfuse2 dependency for Fedora 44)
          wget -q -O appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          wget -q -O runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64

          # 6. Build AppImage using the modern standalone runtime
          ARCH=x86_64 ./appimagetool-x86_64.AppImage \
            --runtime-file runtime-x86_64 \
            --no-appstream \
            AppDir \
            dist/MrCoopersScreenShare-Sender-x86_64.AppImage

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/MrCoopersScreenShare-Sender-Linux.zip
            dist/MrCoopersScreenShare-Sender-x86_64.AppImage
          retention-days: 14

  # =========================================================================
  # 3. Create GitHub Release (Runs on git tags like v1.0.0)
  # =========================================================================
  create-release:
    name: Publish Release Assets
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-onedir-packages
          path: release-assets

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: release-assets

      - name: Create Release and Upload Files
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/MrCoopersScreenShare-Sender-Windows.zip
            release-assets/MrCoopersScreenShare-Receiver-Windows.zip
            release-assets/MrCoopersScreenShare-Sender-Linux.zip
            release-assets/MrCoopersScreenShare-Sender-x86_64.AppImage
          draft: false
          prerelease: false
          compression-level: 6