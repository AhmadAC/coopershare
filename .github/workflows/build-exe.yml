name: Build MrCoopersScreenShare Executables

on:
  push:
    branches: [ "realbad", "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "realbad", "master", "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows 11 Onedir Packages
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14.6
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --prefer-binary PySide6 opencv-python-headless mss sounddevice numpy pynput av pyinstaller

      - name: Build sender (onedir) with PyInstaller
        run: |
          pyinstaller --noconsole --onedir `
            --name "sender" `
            --icon "icon.ico" `
            --add-data "icon.ico;." `
            --add-data "icon.png;." `
            --hidden-import "sounddevice" `
            --hidden-import "pynput" `
            --hidden-import "pynput.keyboard._win32" `
            --hidden-import "pynput.mouse._win32" `
            --hidden-import "mss" `
            --hidden-import "cv2" `
            --hidden-import "av" `
            --hidden-import "PySide6.QtSvg" `
            --hidden-import "PySide6.QtCore" `
            --hidden-import "PySide6.QtGui" `
            --hidden-import "PySide6.QtWidgets" `
            --hidden-import "audio_backend" `
            --hidden-import "config" `
            --hidden-import "input_backend" `
            --hidden-import "threads" `
            --hidden-import "ui_main" `
            --hidden-import "ui_viewer" `
            --hidden-import "utils" `
            --hidden-import "video_backend" `
            sender.py

      - name: Build receiver (onedir) with PyInstaller
        run: |
          pyinstaller --noconsole --onedir `
            --name "receiver" `
            --icon "icon.ico" `
            --add-data "icon.ico;." `
            --add-data "icon.png;." `
            --hidden-import "sounddevice" `
            --hidden-import "pynput" `
            --hidden-import "pynput.keyboard._win32" `
            --hidden-import "pynput.mouse._win32" `
            --hidden-import "mss" `
            --hidden-import "cv2" `
            --hidden-import "av" `
            --hidden-import "PySide6.QtSvg" `
            --hidden-import "PySide6.QtCore" `
            --hidden-import "PySide6.QtGui" `
            --hidden-import "PySide6.QtWidgets" `
            --hidden-import "audio_backend" `
            --hidden-import "config" `
            --hidden-import "input_backend" `
            --hidden-import "threads" `
            --hidden-import "ui_main" `
            --hidden-import "ui_viewer" `
            --hidden-import "utils" `
            --hidden-import "video_backend" `
            receiver.py

      - name: Bundle raw scripts & assets into onedir folders
        run: |
          if (-not (Test-Path "dist\sender\sender.exe")) {
            throw "sender.exe was not created in dist\sender"
          }
          if (-not (Test-Path "dist\receiver\receiver.exe")) {
            throw "receiver.exe was not created in dist\receiver"
          }

          Get-ChildItem -Path . -Filter "*.py" | ForEach-Object {
            Copy-Item $_.FullName -Destination "dist\sender\" -Force
            Copy-Item $_.FullName -Destination "dist\receiver\" -Force
          }

          Copy-Item "icon.ico" -Destination "dist\sender\icon.ico" -ErrorAction SilentlyContinue
          Copy-Item "icon.png" -Destination "dist\sender\icon.png" -ErrorAction SilentlyContinue
          Copy-Item "icon.ico" -Destination "dist\receiver\icon.ico" -ErrorAction SilentlyContinue
          Copy-Item "icon.png" -Destination "dist\receiver\icon.png" -ErrorAction SilentlyContinue
          Copy-Item "history.json" -Destination "dist\sender\history.json" -ErrorAction SilentlyContinue
          Copy-Item "receiver_config.json" -Destination "dist\receiver\receiver_config.json" -ErrorAction SilentlyContinue

      # Upload Sender (GitHub Actions automatically creates a single ZIP)
      - name: Upload Sender Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MrCoopersScreenShare-Sender-Windows
          path: dist/sender
          retention-days: 14

      # Upload Receiver (GitHub Actions automatically creates a single ZIP)
      - name: Upload Receiver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MrCoopersScreenShare-Receiver-Windows
          path: dist/receiver
          retention-days: 14

  create-release:
    name: Publish Release Assets
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-temp

      - name: Package Release ZIP Archives
        run: |
          mkdir -p release-assets
          cd release-temp
          if [ -d "MrCoopersScreenShare-Sender-Windows" ]; then
            cd MrCoopersScreenShare-Sender-Windows && zip -r ../../release-assets/MrCoopersScreenShare-Sender-Windows.zip . && cd ..
          fi
          if [ -d "MrCoopersScreenShare-Receiver-Windows" ]; then
            cd MrCoopersScreenShare-Receiver-Windows && zip -r ../../release-assets/MrCoopersScreenShare-Receiver-Windows.zip . && cd ..
          fi
          cd ..

      - name: Create Release and Upload Zip Archives
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/MrCoopersScreenShare-Sender-Windows.zip
            release-assets/MrCoopersScreenShare-Receiver-Windows.zip
          draft: false
          prerelease: false
          compression-level: 6